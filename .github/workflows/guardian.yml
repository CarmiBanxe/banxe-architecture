name: guardian
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
permissions:
  contents: read
jobs:
  guardian-schemas:
    name: guardian-schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enforce S2 governance JSON-Schemas (IL-156 schemas, IL-164 gate)
        run: |
          set -e
          pip install jsonschema
          python3 schemas/validate_schemas.py
          echo "guardian-schemas OK"
  guardian-factory:
    name: guardian-factory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Factory invariants
        run: |
          set -e
          test -d agents/souls && test -d agents/passports || { echo "factory agent registry missing"; exit 1; }
          test -d .claude/agents || { echo "factory controllers missing"; exit 1; }
          echo "guardian-factory OK"
  guardian-project:
    name: guardian-project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Project invariants (BANXE)
        run: |
          set -e
          test -f README.md || { echo "README missing"; exit 1; }
          echo "guardian-project OK"
  guardian-ledger:
    name: guardian-ledger
    runs-on: ubuntu-latest
    # Run on pull_request AND merge_group so the required status context resolves
    # to success inside the merge queue (ALLGREEN) instead of skipping → timeout.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ledger-coupling gate (ADR-056, ADR-060 shard bridge)
        env:
          # pull_request → PR head/base; merge_group → the merge-group SHAs.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -e
          LEDGER=INSTRUCTION-LEDGER.md
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"; echo "$CHANGED"
          NONLEDGER=$(echo "$CHANGED" | grep -v "^$LEDGER$" || true)
          # ADR-056 scope-narrowing: coupling required for governance/arch paths only; pure-infra exempt
          INFRA_RE='^(scripts/|\.github/|ledger/build_ledger\.py$)|\.sh$'
          NONINFRA=$(echo "$NONLEDGER" | grep -vE "$INFRA_RE" || true)
          if [ -n "$NONLEDGER" ] && [ -z "$NONINFRA" ]; then echo "guardian-ledger OK (pure-infra/tooling change — coupling not required, ADR-056 scope)"; exit 0; fi
          if [ -n "$NONLEDGER" ]; then
            NEW_SHARD=$(git diff --name-status "$BASE_SHA" "$HEAD_SHA" -- 'ledger/entries/' | grep -E '^A' | grep -E 'IL-.*\.md$' || true)
            if [ -z "$NEW_SHARD" ]; then
              echo "FAIL: PR changes tracked paths but adds no new ledger/entries shard (ADR-056 / ADR-060 — rebuild files are gitignored, add shard via scripts/add-il-shard.sh)"; exit 1
            fi
          fi
          DELETED=$(git diff "$BASE_SHA" "$HEAD_SHA" -- "$LEDGER" | grep -E '^-[^-]' || true)
          if [ -n "$DELETED" ]; then
            echo "FAIL: $LEDGER must be append-only (Invariant I-28); deletions detected:"; echo "$DELETED"; exit 1
          fi
          echo "guardian-ledger OK"
  ledger-append-only:
    name: ledger-append-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ledger append-only immutability (ADR-057)
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -e
          LEDGER=INSTRUCTION-LEDGER.md
          if [ "$EVENT" = "pull_request" ]; then
            BASE="$PR_BASE"; HEAD="$PR_HEAD"
          elif [ "$EVENT" = "merge_group" ]; then
            # In the merge queue the append-only (ADR-057) check must run for real,
            # diffing the merge-group base..head — not skip via an empty push 'before'.
            BASE="$MG_BASE"; HEAD="$MG_HEAD"
          else
            BASE="$PUSH_BEFORE"; HEAD="$PUSH_AFTER"
          fi
          if ! git cat-file -e "$BASE" 2>/dev/null; then echo "Base $BASE unavailable (new branch/first push); skipping immutability check"; echo "ledger-append-only OK"; exit 0; fi
          REMOVED=$(git diff "$BASE" "$HEAD" -- "$LEDGER" | grep -E '^-[^-]' || true)
          if [ -n "$REMOVED" ]; then
            echo "FAIL: existing $LEDGER lines were removed or modified (Invariant I-28, ADR-057). Corrections must be a NEW appended IL block, never an edit of prior history:"; echo "$REMOVED"; exit 1
          fi
          echo "ledger-append-only OK"
  guardian-ledger-shards:
    name: guardian-ledger-shards
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    concurrency:
      group: ledger-projection-${{ github.base_ref || github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Shard append-only invariant (ADR-059 S3, I-28)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          SHARDS='ledger/entries/'
          MUTATED=$(git diff --name-status "$BASE_SHA" "$HEAD_SHA" -- "$SHARDS" | grep -E '^(D|R|M)' || true)
          if [ -n "$MUTATED" ]; then
            echo "FAIL: shards under $SHARDS are append-only (Invariant I-28, ADR-059 S3). Only NEW shard files may be added; deletions/renames/edits are forbidden:"
            echo "$MUTATED"
            exit 1
          fi
          echo "shard append-only OK"
      - name: Generated artifact == rebuild (ADR-059 S3)
        run: |
          set -e
          python ledger/build_ledger.py --check
          echo "guardian-ledger-shards OK"
  guardian-branch-naming:
    name: guardian-branch-naming
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Branch namespace convention (ADR-060)
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -e
          echo "Head branch: $BRANCH"
          # specproj = ADR-TERMINAL-B-SPEC-LANE Terminal-B namespace
          PATTERN='^agent/(central|right|factory|specproj)/[A-Za-z0-9]+/[a-z0-9._-]+$'
          if echo "$BRANCH" | grep -qE '^(dependabot|renovate|revert)/'; then
            echo "guardian-branch-naming OK (allow-listed prefix)"; exit 0
          fi
          if ! echo "$BRANCH" | grep -qE "$PATTERN"; then
            echo "FAIL: branch '$BRANCH' violates ADR-060 namespace agent/<actor>/<id>/<slug> (actor=central|right|factory|specproj)"; exit 1
          fi
          echo "guardian-branch-naming OK"

  guardian-adr117:
    name: guardian-adr117
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ADR-117 placeholder gate (ACCEPTED requires all OPERATOR-DECISION filled)
        run: bash scripts/adr117-gate-check.sh

  guardian-traceability:
    name: guardian-traceability
    runs-on: ubuntu-latest
    # Informational / non-required until stabilized (ADR-132). Never blocks a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ADR<->implementation & souls<->SKILLS-MATRIX traceability gate (ADR-132, informational)
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: bash scripts/adr-traceability-check.sh
