# ═══════════════════════════════════════════════════════════════════════════
# BANXE AI Agent Pipeline — ACTIVE in SANDBOX ONLY (STEP 4 Promotion Gate 2026-07-26)
# BANXE_ENV=sandbox ; BANXE_DATA_CLASS=TRAINING ; BANXE_PROD_READY=false
# Triggers restricted to sandbox branch patterns — prod pipeline untouched.
# Source lineage: docs/engine/proposed-workflows/banxe-agent-review.yml (superseded).
# Prod activation = separate PROD Promotion Gate (ADR-171 §PROD-CUTOVER CONTRACT).
# ═══════════════════════════════════════════════════════════════════════════
name: BANXE AI Agent Pipeline (SANDBOX)

on:
  push:
    branches:
      - 'sandbox/**'
      - 'agent/*/sandbox/**'
  pull_request:
    branches:
      - 'sandbox/**'

env:
  BANXE_ENV: sandbox
  BANXE_DATA_CLASS: TRAINING
  BANXE_PROD_READY: "false"

jobs:
  analysis-agent:
    name: Code Analysis (Claude Code Action)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          scope: "security,logic,banking-patterns"

  security-agent:
    name: OWASP LLM Top-10 Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: LLM security scan (prompt-injection / insecure-output / excessive-agency)
        run: |
          # Mitigation map: docs/engine/BANXE-SECURITY-OWASP.md
          semgrep --config .semgrep/ --error

  compliance-gate:
    name: EU AI Act Compliance Check (sandbox)
    needs: [analysis-agent, security-agent]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: AI Decision Audit Schema Validation
        # Contract: banxe_audit.hitl_decisions on SANDBOX ClickHouse
        # (sql/alter-banxe-audit-hitl-decisions-engine-ref-2026-07-26.sql, operator-run)
        run: python validate_decision_schema.py

  deploy-staging:
    name: Deploy to Sandbox-Staging (confidence >= staging gate)
    needs: compliance-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confidence gate (config-as-data)
        # threshold source: config/gates/confidence-thresholds.yaml (deployment_gates.staging = 0.75)
        run: python tools/check_confidence_gate.py --stage staging

  deploy-production:
    name: Deploy to Sandbox-Prod (confidence >= prod gate + human approval)
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: sandbox-production   # human approval required (HITL); TRAINING data only
    steps:
      - uses: actions/checkout@v4
      - name: Confidence gate (config-as-data)
        # threshold source: config/gates/confidence-thresholds.yaml (deployment_gates.production = 0.90)
        run: python tools/check_confidence_gate.py --stage production
