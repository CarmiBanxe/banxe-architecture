name: main-serialize

# Software serialization of merges into `main` for a USER-OWNED repo where the native
# GitHub merge queue is unavailable (org-only feature). Variant B: a concurrency-group
# queues the gate one-PR-at-a-time, and a base-drift guard fails any PR that is behind
# origin/main so it must be rebased before merge (prevents stale-base revert / DIRTY).
# Pairs with the Redis central IL allocator (ADR-143/143-A, ID-collision root).
# See docs/governance/MERGE-SERIALIZATION-FALLBACK.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  merge_group:
    types: [checks_requested]
permissions:
  contents: read

# cancel-in-progress:false → gates line up in the Actions queue instead of cancelling
# each other = soft serialization (one base-drift evaluation at a time).
concurrency:
  group: "main-merge-serialize"
  cancel-in-progress: false

jobs:
  main-merge-serialize:
    name: main-merge-serialize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Base-drift guard (PR must be up-to-date with origin/main)
        run: |
          set -e
          git fetch --quiet origin main
          MAIN_SHA=$(git rev-parse origin/main)
          HEAD_SHA=$(git rev-parse HEAD)
          BASE_SHA=$(git merge-base HEAD origin/main)
          BEHIND=$(git rev-list --count HEAD..origin/main)
          AHEAD=$(git rev-list --count origin/main..HEAD)
          echo "origin/main  : $MAIN_SHA"
          echo "PR head      : $HEAD_SHA"
          echo "merge-base   : $BASE_SHA"
          echo "behind/ahead : $BEHIND / $AHEAD"
          if [ "$BEHIND" -gt 0 ]; then
            echo "::error::BASE DRIFT: PR is $BEHIND commits behind origin/main — rebase via hard-reset recipe before merge (prevents stale-base revert / DIRTY)."
            exit 1
          fi
          echo "main-merge-serialize OK (up-to-date with origin/main; behind=0)"
