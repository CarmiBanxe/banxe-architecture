# banxe-architecture/agents/passports/aml/banxe_aml_orchestrator.yaml
# IL-068 | Governance passport (SMF17/HITL format)
# CANONICAL after ADR-102 dedup (2026-07-07, operator ruling): the SINGLE passport for
# banxe_aml_orchestrator (L1 top orchestrator). Merges the operational layer (ports/skills/
# callees/capabilities) from the now-SUPERSEDED root passport
# agents/passports/banxe_aml_orchestrator.yaml. Conflicts resolved to the safer value
# (trust_zone RED > AMBER; change_class MAJOR > CLASS_B). aml_orchestrator (the L2
# sub-orchestrator) is a SEPARATE agent — NOT merged; the top->sub pipeline edge is preserved
# (aml_orchestrator remains in allowed_callees). Activation is unchanged: status PROPOSED.

agent_id: banxe_aml_orchestrator
name: "Banxe AML Orchestrator"
version: "3.0.0"
status: PROPOSED             # dedup resolves identity only — activation is a separate I-27 operator+MLRO act
description: >
  Core AML orchestration agent for Banxe AI Bank — the top-level Level-1 orchestrator.
  Receives CustomerProfile, coordinates the Level-2 sub-agents (aml_orchestrator,
  sanctions_check, tx_monitor, crypto_aml), aggregates scores, builds the ExplanationBundle
  and emits the final BanxeAMLResult; coordinates Jube TM, Marble cases, sanctions/watchlist
  checks and MLRO workflows across all customer and transaction types, in line with
  COMPLIANCE-ARCH and COMPLIANCE-MATRIX.

level: 1                     # top orchestrator (L1)
autonomy_level: L3           # can initiate workflows / propose actions, never final SAR/PEP/SUBMIT
trust_zone: RED              # high-risk financial crime domain
bounded_context: CTX-01

capabilities:
  - orchestrate
  - risk_assessment
  - score_aggregate
  - explanation_build
  - emergency_check

human_double:
  primary: HEAD_OF_FINCRIME # Руководитель блока AML/Financial Crime
  secondary: MLRO           # MLRO — отдельный дублёр для всех критичных решений

fca_basis:
  smf_function: SMF17       # MLRO function under FSMA s59 (JMLSG 3.10–3.20)
  oversight: >
    MLRO retains ultimate managerial responsibility for AML/CTF controls,
    including transaction monitoring, sanctions and SAR decisions.

fca_references:
  - "MLR 2017 Reg.28 — ongoing monitoring"
  - "FCA SS1/23 — model risk management"
  - "EU AI Act Art.14 — human oversight"

aigf_risks:
  - AIGF-A-01
  - AIGF-B-01
  - AIGF-C-01

governance:
  change_class: MAJOR        # stricter of {CLASS_B (root), MAJOR (gov)} — any logic change needs SMF17 sign-off + HITL update
  owner: "Compliance Engineering"
  review_cycle: quarterly
  last_reviewed: "2026-04-05"
  approvers:
    - DEVELOPER
    - CTIO
    - CEO
    - MLRO                   # AML sign-off role (SMF17)

ports:
  inbound:
    - port: PolicyPort
      interface: src/compliance/ports/policy_port.py
      adapter: src/compliance/adapters/compliance_config_adapter.py
    - port: EmergencyPort
      interface: src/compliance/ports/emergency_port.py
      adapter: src/compliance/emergency_stop.py
  outbound:
    - port: AuditPort
      interface: src/compliance/ports/audit_port.py
      adapter: src/compliance/adapters/banxe_aml_decision_adapter.py
    - port: DecisionPort
      interface: src/compliance/ports/decision_port.py
      adapter: src/compliance/adapters/banxe_aml_decision_adapter.py

allowed_callers: []          # top orchestrator — called by none
allowed_callees:
  - aml_orchestrator         # L2 sub-orchestrator — pipeline edge PRESERVED (separate agent, not merged)
  - sanctions_check
  - tx_monitor
  - crypto_aml

invariants:
  - I-21
  - I-22
  - I-23
  - I-24
  - I-25

hitl_gates:
  # агент может только ИНИЦИИРОВАТЬ эти воркфлоу, финал — строго по HITL-MATRIX.yaml
  - gate_id: SAR_filing
    auto_allowed: false
  - gate_id: AML_threshold_change
    auto_allowed: false
  - gate_id: Sanctions_reversal
    auto_allowed: false
  - gate_id: Sanctions_BLOCK
    auto_allowed: true       # Автоблок разрешён, но с немедленным уведомлением MLRO

allowed_actions:
  - run_tm_scenarios          # запуск Jube TM сценариев
  - create_tm_case            # создание кейсов в Marble
  - trigger_sanctions_screen  # запуск скрининга через Watchman / Banxe Screener
  - propose_alert_routing     # маршрутизация алертов по COMPLIANCE-MATRIX
  - generate_risk_summary     # подготовка резюме для MLRO / Head of FinCrime
  - hitl_check_gate           # вызов OrgRoleChecker для проверки присутствия ролей

forbidden_actions:
  - submit_SAR                # подача SAR в NCA
  - retract_SAR               # отзыв SAR
  - final_PEP_approval        # финальное решение по PEP
  - change_AML_thresholds     # изменение порогов TM / сценариев Jube
  - modify_HITL_matrix        # любые правки HITL-MATRIX.yaml

audit:
  log_channel: clickhouse_aml_events  # логирование в ClickHouse (5 лет, I-08)
  pii_policy: PII_PROXY_REQUIRED      # всё PII только через Presidio proxy

# ── Passport-bound skills (S-FAC-64; binding metadata only — does NOT activate) ──
allowed_skills:
  - context_memory_sync          # MANDATORY — IL/audit-trail continuity (I-28)
  - rapid_spec_builder           # MANDATORY — Level-1 orchestrator proposes IL/ADR for new sub-agent/port (I-28)
  - clean_architecture_enforcer  # MANDATORY — no cross-contour imports across the 4 ports/adapters (I-20)
  - error_handling_standardizer  # MANDATORY — typed exceptions on PolicyPort/AuditPort; AuditPort writes survive (I-24)
  - api_contract_guardian        # MANDATORY — owns PolicyPort/EmergencyPort/AuditPort/DecisionPort contracts
  - performance_scanner          # MANDATORY — AML score-aggregate / risk-assessment is a time-critical path
  - smart_test_generator         # CONTROLLED — scenario/port tests; no real PII in fixtures, no float (I-05), no mocked audit writes (I-24)
  - dependency_optimizer         # CONTROLLED — adapter Python deps + licence audit (IL required)
prohibited_skills:
  - auto_refactor_pro            # PROHIBITED — AML compliance contour; ARP forbidden on services/aml/ (I-20, SKILLS-MATRIX §9)
preferred_skill_sequences:
  scenario_compliance:           # any change touching the AML orchestration / ports
    - context_memory_sync
    - rapid_spec_builder
    - api_contract_guardian      # PolicyPort/EmergencyPort/AuditPort/DecisionPort contract
    - error_handling_standardizer
    - performance_scanner        # AML scoring latency
    - smart_test_generator
    # quality-gate.sh MUST follow
mandatory_skill_triggers:
  context_memory_sync: ["any banxe_aml_orchestrator session start", "after any IL state change"]
  api_contract_guardian: ["PolicyPort change", "EmergencyPort change", "AuditPort change", "DecisionPort change"]
  error_handling_standardizer: ["new adapter added", "AuditPort write-path change (I-24)"]
  performance_scanner: ["AML scoring path change", "score-aggregate latency regression"]

superseded: []               # this is the canonical; supersedes agents/passports/banxe_aml_orchestrator.yaml
