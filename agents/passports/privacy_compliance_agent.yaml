agent_id: privacy_compliance_agent
name: "PrivacyComplianceAgent"
version: "0.1.0"
status: PROPOSED
description: >
  DPO support agent. Maintains the DPIA framework, triages DSAR (Data Subject
  Access Requests), and tracks UK GDPR Art.37-39 obligations. PROPOSES only
  (I-27) — final DPO determinations remain with the human Head of Compliance.
level: 2
trust_zone: AMBER
bounded_context: CTX-01
autonomy: L2_REVIEW
capabilities:
  - dpia_assessment
  - dsar_triage
  - privacy_risk_flagging
  - gdpr_obligation_tracking
department: "Data Protection / Compliance"
human_double: "Head of Compliance"
ports:
  inbound:
    - port: PrivacyRequestPort
      description: Receives DSAR / DPIA assessment requests
  outbound:
    - port: CompliancePort
      description: Escalates privacy risk to Head of Compliance (HITL)
    - port: AuditPort
      description: Immutable log of privacy decisions (I-08)
allowed_callers:
  - customer_lifecycle_agent
  - admin_panel
allowed_callees:
  - compliance_officer_v1
  - notification_agent
invariants:
  - I-27  # agent PROPOSES only — human DPO decides
  - I-08  # log all privacy/compliance decisions
governance:
  change_class: CLASS_B
  owner: "Head of Compliance"
  review_cycle: annually
  last_reviewed: "2026-06-18"
  approvers:
    - Head of Compliance
    - CEO
fca_references:
  - "UK GDPR Art.37-39 — DPO appointment, tasks and position"
  - "DPA 2018 / UK GDPR — DSAR handling and DPIA"

# ── Passport-bound skills (S-FAC-64; binding metadata only — does NOT activate, I-27) ──
allowed_skills:
  - context_memory_sync          # MANDATORY — IL/audit-trail continuity (I-28)
  - rapid_spec_builder           # MANDATORY — proposes IL/ADR (I-27, I-28)
  - clean_architecture_enforcer  # MANDATORY — no cross-contour imports (I-20)
  - error_handling_standardizer  # MANDATORY — typed exceptions on ports/adapters
  - api_contract_guardian        # MANDATORY — owns port/API/webhook contract(s)
  - smart_test_generator         # CONTROLLED — port/scenario tests (no PII, no float I-05, no mocked audit I-24)
prohibited_skills:
  - auto_refactor_pro            # PROHIBITED — data-protection/compliance contour — ARP forbidden (I-20)
preferred_skill_sequences:
  scenario_compliance:
    - context_memory_sync
    - rapid_spec_builder
    - api_contract_guardian
    - error_handling_standardizer
    - smart_test_generator
    # quality-gate.sh MUST follow
mandatory_skill_triggers:
  context_memory_sync: ["any privacy_compliance_agent session start", "after any IL state change"]
  rapid_spec_builder: ["new IL proposal", "new ADR needed", "governance/spec recommendation"]
  api_contract_guardian: ["port / REST router / webhook schema change"]
  error_handling_standardizer: ["new adapter added", "AuditPort write-path change (I-24)"]
