agent_id: yente_adapter
name: "Yente OpenSanctions Adapter"
version: "1.0.0"
description: >
  Level-3 AMBER adapter. Wraps OpenSanctions Yente API for PEP and
  sanctions matching. Provides richer dataset than Watchman for complex
  entity matching. Used as fallback/cross-check alongside Watchman.
level: 3
trust_zone: AMBER
bounded_context: CTX-01
capabilities:
  - sanctions_screening
  - pep_screening
ports:
  outbound:
    - port: AuditPort
      interface: src/compliance/ports/audit_port.py
allowed_callers:
  - sanctions_check
  - aml_orchestrator
allowed_callees: []
invariants:
  - I-24
governance:
  change_class: CLASS_B
  owner: "Compliance Engineering"
  review_cycle: quarterly
  last_reviewed: "2026-04-05"
  approvers:
    - DEVELOPER
    - MLRO
fca_references:
  - "MLR 2017 Reg.28(1)"
  - "FCA JMLSG Part I 5.3 — PEP screening"
aigf_risks:
  - AIGF-E-01

# ── Passport-bound skills (S-FAC-64; binding metadata only — does NOT activate, I-27) ──
allowed_skills:
  - context_memory_sync          # MANDATORY — IL/audit-trail continuity (I-28)
  - clean_architecture_enforcer  # MANDATORY — no cross-contour imports (I-20)
  - error_handling_standardizer  # MANDATORY — typed exceptions on ports/adapters
  - api_contract_guardian        # MANDATORY — owns port/API/webhook contract(s)
  - smart_test_generator         # CONTROLLED — port/scenario tests (no PII, no float I-05, no mocked audit I-24)
  - performance_scanner          # MANDATORY — time-critical AML/payment/recon path
prohibited_skills:
  - auto_refactor_pro            # PROHIBITED — sanctions/AML contour — ARP forbidden on services/aml (I-20)
preferred_skill_sequences:
  scenario_compliance:
    - context_memory_sync
    - api_contract_guardian
    - error_handling_standardizer
    - performance_scanner
    - smart_test_generator
    # quality-gate.sh MUST follow
mandatory_skill_triggers:
  context_memory_sync: ["any yente_adapter session start", "after any IL state change"]
  api_contract_guardian: ["port / REST router / webhook schema change"]
  error_handling_standardizer: ["new adapter added", "AuditPort write-path change (I-24)"]
  performance_scanner: ["AML/payment/recon path change", "scoring latency regression"]
