agent_id: design_pipeline_agent
name: "DesignPipelineAgent"
version: "1.0.0"
status: ACTIVE
description: >
  Owner agent for the EXISTING banxe-emi-stack runtime service `services/design_pipeline/`
  (code-derived from its handlers, e.g. CodeGeneratorPort). ACTIVATED 2026-07-01 per ADR-155
  (operator I-27 gate; CLASS_B; CTO+CEO approval); governs the existing services/design_pipeline/
  runtime. I-27 HITL retained at decision-time (L2_REVIEW); future material change is ADR-135-gated.
level: 2
trust_zone: AMBER
bounded_context: CTX-09-DEVPLATFORM
autonomy: L2_REVIEW
capabilities:
  - design_to_code
  - component_catalog
  - design_token_management
  - visual_regression_config
  - aesthetic_taste_review        # ACTIVE; advisory only, never a gate (I-27 HITL at decision-time).
department: "Engineering / Developer Platform"
human_double: "CTO"
non_goals:
  - "Do NOT reimplement services/design_pipeline/ — existing code in banxe-emi-stack"
  - "Taste review (aesthetic_taste_review) is ADVISORY ONLY — never a promotion/merge/governance gate (canon §5A); θ=on-canon feeds the impeccable-loop stop-condition only; owner=interim CTO (canon §7.2)"
  - "Material change to capabilities / θ / taste-semantics requires operator HITL via ADR-135 (I-27 retained at decision-time)"
ports:
  inbound:
    - port: DesignSpecPort
      description: Primary inbound port (code-derived from services/design_pipeline)
  outbound:
    - port: CodeGeneratorPort
      description: derived from services/design_pipeline code
    - port: AuditPort
      description: Immutable audit log (I-08)
    - port: TasteScorePort
      description: >
        ADVISORY-ONLY. Emits taste sub-scores (advisory bands per
        docs/BANXE-UI-UX-SYSTEM.md §"Taste Rubric (advisory)") + concrete deltas.
        NOT a gate; never blocks promotion. θ = on-canon (band threshold — impeccable-loop
        stop-condition only, advisory; operator-set 2026-06-30; config-as-data per
        UI-UX-DESIGN-SYSTEM-CANON §8 OI-5). ACTIVE; advisory output only (I-27 HITL retained at decision-time).
allowed_callers:
  - sandbox_rails_governor
allowed_callees:
  - sdk_release_governor
invariants:
  - I-27
  - I-08
governance:
  change_class: CLASS_B
  owner: "CTO"
  review_cycle: annually
  last_reviewed: "2026-07-01"
  approvers:
    - CTO
    - CEO
fca_references:
  - "FCA SYSC 8 — change management / dev platform"

# ── Passport-bound skills (S-FAC-64; binding metadata only — does NOT activate, I-27) ──
allowed_skills:
  - context_memory_sync          # MANDATORY — IL/audit-trail continuity (I-28)
  - clean_architecture_enforcer  # MANDATORY — no cross-contour imports across ports (I-20)
  - error_handling_standardizer  # MANDATORY — typed exceptions on ports/adapters
  - api_contract_guardian        # MANDATORY — owns DesignSpecPort/CodeGeneratorPort/AuditPort contract(s)
  - smart_test_generator         # CONTROLLED — port/scenario tests (no PII, no float I-05, no mocked audit I-24)
  - dependency_optimizer         # CONTROLLED — service deps + licence audit (IL required)
preferred_skill_sequences:
  scenario_service:
    - context_memory_sync
    - api_contract_guardian
    - error_handling_standardizer
    - smart_test_generator
    # quality-gate.sh MUST follow
mandatory_skill_triggers:
  context_memory_sync: ["any design_pipeline_agent session start", "after any IL state change"]
  api_contract_guardian: ["DesignSpecPort/CodeGeneratorPort/AuditPort change", "REST router / webhook schema change"]
  error_handling_standardizer: ["new adapter added", "AuditPort write-path change (I-24)"]
