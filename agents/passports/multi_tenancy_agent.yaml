agent_id: multi_tenancy_agent
name: "MultiTenancyAgent"
version: "0.1.0"
status: PROPOSED
description: >
  Owner agent for the EXISTING banxe-emi-stack runtime service `services/multi_tenancy/`
  (code-derived from its handlers, e.g. TenantPort). PROPOSES only (I-27); created by
  SP-PASSPORT-COV to close the orphan-service governance gap. NOT activated — PROPOSED
  until a separate operator gate.
level: 2
trust_zone: AMBER
bounded_context: CTX-09-DEVPLATFORM
autonomy: L2_REVIEW
capabilities:
  - tenant_isolation
  - data_isolation_validation
  - quota_enforcement
  - tenant_audit
department: "Engineering / Developer Platform"
human_double: "CTO"
non_goals:
  - "Do NOT reimplement services/multi_tenancy/ — existing code in banxe-emi-stack"
  - "Do NOT auto-activate — PROPOSED only (I-27), gated on operator approval"
ports:
  inbound:
    - port: TenantPort
      description: Primary inbound port (code-derived from services/multi_tenancy)
  outbound:
    - port: QuotaPort
      description: derived from services/multi_tenancy code
    - port: TenantAuditPort
      description: derived from services/multi_tenancy code
    - port: AuditPort
      description: Immutable audit log (I-08)
allowed_callers:
  - m_gateway_api_governor
allowed_callees:
  - clickhouse_writer
invariants:
  - I-27
  - I-08
governance:
  change_class: CLASS_B
  owner: "CTO"
  review_cycle: annually
  last_reviewed: "2026-06-21"
  approvers:
    - CTO
fca_references:
  - "UK GDPR Art.32 — data isolation/security"
  - "FCA SYSC 8 — segregation"

# ── Passport-bound skills (S-FAC-64; binding metadata only — does NOT activate, I-27) ──
allowed_skills:
  - context_memory_sync          # MANDATORY — IL/audit-trail continuity (I-28)
  - rapid_spec_builder           # MANDATORY — proposes IL/ADR (I-27, I-28)
  - clean_architecture_enforcer  # MANDATORY — no cross-contour imports (I-20)
  - error_handling_standardizer  # MANDATORY — typed exceptions on ports/adapters
  - api_contract_guardian        # MANDATORY — owns port/API/webhook contract(s)
  - smart_test_generator         # CONTROLLED — port/scenario tests (no PII, no float I-05, no mocked audit I-24)
  - dependency_optimizer         # CONTROLLED — deps + licence audit (IL required)
preferred_skill_sequences:
  scenario_service:
    - context_memory_sync
    - rapid_spec_builder
    - api_contract_guardian
    - error_handling_standardizer
    - smart_test_generator
    # quality-gate.sh MUST follow
mandatory_skill_triggers:
  context_memory_sync: ["any multi_tenancy_agent session start", "after any IL state change"]
  rapid_spec_builder: ["new IL proposal", "new ADR needed", "governance/spec recommendation"]
  api_contract_guardian: ["port / REST router / webhook schema change"]
  error_handling_standardizer: ["new adapter added", "AuditPort write-path change (I-24)"]
  dependency_optimizer: ["new dependency added", "Docker base image update", "licence audit request"]
