agent_id: sanctions_check
name: "Sanctions Screening Agent"
version: "2.0.0"
description: >
  Level-2 agent. Screens customer name, country and entity against OFAC SDN,
  HMT/OFSI consolidated list, and UN sanctions. Applies 10-jurisdiction HARD
  REJECT policy (Category A) and 30+ jurisdiction EDD/HOLD policy (Category B).
level: 2
trust_zone: AMBER
bounded_context: CTX-01
capabilities:
  - sanctions_screening
  - risk_assessment
ports:
  inbound:
    - port: PolicyPort
      interface: src/compliance/ports/policy_port.py
      adapter: src/compliance/adapters/compliance_config_adapter.py
  outbound:
    - port: AuditPort
      interface: src/compliance/ports/audit_port.py
allowed_callers:
  - banxe_aml_orchestrator
allowed_callees:
  - yente_adapter
  - watchman_adapter
invariants:
  - I-21
  - I-24
decision_thresholds:
  reject: 70.0
  hold: 40.0
governance:
  change_class: CLASS_B
  owner: "Compliance Engineering"
  review_cycle: monthly
  last_reviewed: "2026-04-05"
  approvers:
    - DEVELOPER
    - CTIO
    - MLRO
fca_references:
  - "MLR 2017 Reg.28(1) — sanctions checking"
  - "OFSI Consolidated List"
  - "UK Sanctions List"
aigf_risks:
  - AIGF-A-01
  - AIGF-E-01

# ── Passport-bound skills (S-FAC-64; binding metadata only — does NOT activate, I-27) ──
allowed_skills:
  - context_memory_sync          # MANDATORY — IL/audit-trail continuity (I-28)
  - rapid_spec_builder           # MANDATORY — proposes IL/ADR (I-27, I-28)
  - clean_architecture_enforcer  # MANDATORY — no cross-contour imports (I-20)
  - error_handling_standardizer  # MANDATORY — typed exceptions on ports/adapters
  - api_contract_guardian        # MANDATORY — owns port/API/webhook contract(s)
  - smart_test_generator         # CONTROLLED — port/scenario tests (no PII, no float I-05, no mocked audit I-24)
  - performance_scanner          # MANDATORY — time-critical AML/payment/recon path
prohibited_skills:
  - auto_refactor_pro            # PROHIBITED — sanctions/AML contour — ARP forbidden on services/aml (I-20)
preferred_skill_sequences:
  scenario_compliance:
    - context_memory_sync
    - rapid_spec_builder
    - api_contract_guardian
    - error_handling_standardizer
    - performance_scanner
    - smart_test_generator
    # quality-gate.sh MUST follow
mandatory_skill_triggers:
  context_memory_sync: ["any sanctions_check session start", "after any IL state change"]
  rapid_spec_builder: ["new IL proposal", "new ADR needed", "governance/spec recommendation"]
  api_contract_guardian: ["port / REST router / webhook schema change"]
  error_handling_standardizer: ["new adapter added", "AuditPort write-path change (I-24)"]
  performance_scanner: ["AML/payment/recon path change", "scoring latency regression"]
