  - context_memory_sync          # MANDATORY — IL/audit-trail continuity (I-28)
  - rapid_spec_builder           # MANDATORY — proposes IL/ADR (I-27, I-28)
prohibited_skills:
  - auto_refactor_pro            # PROHIBITED — safeguarding/CASS contour — ARP forbidden (I-20)
preferred_skill_sequences:
  scenario_governance:
    - context_memory_sync
    - rapid_spec_builder
    # quality-gate.sh MUST follow
mandatory_skill_triggers:
  context_memory_sync: ["any safeguarding_recon_governor session start", "after any IL state change"]
  rapid_spec_builder: ["new IL proposal", "new ADR needed", "governance/spec recommendation"]
