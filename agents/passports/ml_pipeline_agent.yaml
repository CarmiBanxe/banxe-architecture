agent_id: ml_pipeline_agent
name: "MlPipelineAgent"
version: "0.1.0"
status: PROPOSED
description: >
  Owner agent for the EXISTING banxe-emi-stack runtime service `services/ml_pipeline/`
  (code-derived from its handlers, e.g. MLSignalPort). PROPOSES only (I-27); created by
  SP-PASSPORT-COV to close the orphan-service governance gap. NOT activated — PROPOSED
  until a separate operator gate.
level: 2
trust_zone: AMBER
bounded_context: CTX-03
autonomy: L2_REVIEW
capabilities:
  - model_drift_detection
  - ml_signal_read
  - model_registry_signal
department: "Technology / Data & ML Engineering"
human_double: "CTO"
non_goals:
  - "Do NOT reimplement services/ml_pipeline/ — existing code in banxe-emi-stack"
  - "Do NOT auto-activate — PROPOSED only (I-27), gated on operator approval"
ports:
  inbound:
    - port: MLSignalPort
      description: Primary inbound port (code-derived from services/ml_pipeline)
  outbound:
    - port: AuditPort
      description: Immutable audit log (I-08)
allowed_callers:
  - resilience_agent
allowed_callees:
  - clickhouse_writer
invariants:
  - I-27
  - I-08
governance:
  change_class: CLASS_B
  owner: "CTO"
  review_cycle: annually
  last_reviewed: "2026-06-21"
  approvers:
    - CTO
fca_references:
  - "EU AI Act Art.15 — accuracy/robustness monitoring (drift)"
# ── Passport-bound skills (S-FAC-64; binding metadata only — does NOT activate, I-27) ──
allowed_skills:
  - context_memory_sync          # MANDATORY — IL + model-registry signal-state continuity
  - rapid_spec_builder           # MANDATORY — PROPOSES IL/ADR for model/pipeline changes (I-27, I-28)
  - error_handling_standardizer  # MANDATORY — ML signal handlers typed; AuditPort writes survive (I-08)
  - performance_scanner          # MANDATORY — ML signal/inference hot path + drift-scan latency
  - api_contract_guardian        # MANDATORY — owns MLSignalPort contract
  - clean_architecture_enforcer  # MANDATORY advisory — no cross-contour imports (CTX-03, I-20)
  - smart_test_generator         # CONTROLLED — drift-detection tests (no real customer data in fixtures)
prohibited_skills:
  - auto_refactor_pro            # PROHIBITED — model-drift/scoring logic is governance-sensitive (EU AI Act Art.15)
preferred_skill_sequences:
  scenario_new_feature:
    - context_memory_sync
    - rapid_spec_builder         # IL/ADR before model or pipeline change (I-28)
    - api_contract_guardian      # MLSignalPort contract
    - performance_scanner        # inference / drift-scan SLA
    - error_handling_standardizer
    - smart_test_generator
    # quality-gate.sh MUST follow
  scenario_drift_detection:
    - context_memory_sync
    - performance_scanner        # drift-scan hot path
    - error_handling_standardizer  # typed; AuditPort durability (I-08)
    # quality-gate.sh MUST follow
mandatory_skill_triggers:
  context_memory_sync: ["any ml_pipeline_agent session start", "model registry signal change"]
  rapid_spec_builder: ["new model", "pipeline change", "drift threshold change"]
  api_contract_guardian: ["MLSignalPort change"]
  performance_scanner: ["inference hot-path change", "drift-scan change", "throughput claim"]
  error_handling_standardizer: ["ML signal handler change", "AuditPort write path change (I-08)"]
