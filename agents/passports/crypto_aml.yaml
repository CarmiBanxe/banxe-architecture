agent_id: crypto_aml
name: "Crypto AML Screening Agent"
version: "1.2.0"
description: >
  Level-2 agent. Screens crypto wallet addresses for darknet market exposure,
  mixer usage, and high-risk exchange associations. Integrates heuristic scoring
  and optional Chainalysis-compatible feed (not connected, placeholder).
level: 2
trust_zone: AMBER
bounded_context: CTX-01
capabilities:
  - crypto_aml
  - risk_assessment
ports:
  inbound:
    - port: PolicyPort
      interface: src/compliance/ports/policy_port.py
      adapter: src/compliance/adapters/compliance_config_adapter.py
  outbound:
    - port: AuditPort
      interface: src/compliance/ports/audit_port.py
allowed_callers:
  - banxe_aml_orchestrator
allowed_callees: []
invariants:
  - I-21
  - I-24
governance:
  change_class: CLASS_B
  owner: "Compliance Engineering"
  review_cycle: quarterly
  last_reviewed: "2026-04-05"
  approvers:
    - DEVELOPER
    - CTIO
fca_references:
  - "FCA PS19/22 — cryptoasset AML"
aigf_risks:
  - AIGF-A-03
  - AIGF-D-01

# ── Passport-bound skills (S-FAC-64; binding metadata only — does NOT activate, I-27) ──
allowed_skills:
  - context_memory_sync          # MANDATORY — IL/audit-trail continuity (I-28)
  - rapid_spec_builder           # MANDATORY — proposes IL/ADR for new port/service (I-28)
  - clean_architecture_enforcer  # MANDATORY — no cross-contour imports across ports (I-20)
  - error_handling_standardizer  # MANDATORY — typed exceptions on ports/adapters
  - api_contract_guardian        # MANDATORY — owns PolicyPort/AuditPort contract(s)
  - smart_test_generator         # CONTROLLED — port/scenario tests (no PII, no float I-05, no mocked audit I-24)
  - performance_scanner          # MANDATORY — payment/scoring path is time-critical
prohibited_skills:
  - auto_refactor_pro            # PROHIBITED — AML contour — ARP forbidden on services/aml (I-20)
preferred_skill_sequences:
  scenario_compliance:
    - context_memory_sync
    - api_contract_guardian
    - error_handling_standardizer
    - performance_scanner
    - smart_test_generator
    # quality-gate.sh MUST follow
mandatory_skill_triggers:
  context_memory_sync: ["any crypto_aml session start", "after any IL state change"]
  api_contract_guardian: ["PolicyPort/AuditPort change", "REST router / webhook schema change"]
  error_handling_standardizer: ["new adapter added", "AuditPort write-path change (I-24)"]
  performance_scanner: ["payment/scoring path change", "settlement latency regression"]
