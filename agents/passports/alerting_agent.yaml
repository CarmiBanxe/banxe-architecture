agent_id: alerting_agent
name: "AlertingAgent"
version: "0.1.0"
status: PROPOSED
description: >
  Owner agent for the EXISTING banxe-emi-stack runtime service `services/alerting/`
  (code-derived from its handlers, e.g. AlertRouter). PROPOSES only (I-27); created by
  SP-PASSPORT-COV to close the orphan-service governance gap. NOT activated — PROPOSED
  until a separate operator gate.
level: 2
trust_zone: AMBER
bounded_context: CTX-06-CUSTOMER
autonomy: L2_REVIEW
capabilities:
  - alert_routing
  - alert_severity_classification
  - telegram_n8n_dispatch
department: "Operations / Alerting"
human_double: "COO"
non_goals:
  - "Do NOT reimplement services/alerting/ — existing code in banxe-emi-stack"
  - "Do NOT auto-activate — PROPOSED only (I-27), gated on operator approval"
ports:
  inbound:
    - port: AlertRoutingPort
      description: Primary inbound port (code-derived from services/alerting)
  outbound:
    - port: N8nTelegramAlertPort
      description: derived from services/alerting code
    - port: AuditPort
      description: Immutable audit log (I-08)
allowed_callers:
  - safeguarding_recon_governor
  - support_sla_governor
allowed_callees:
  - notification_agent
invariants:
  - I-27
  - I-08
governance:
  change_class: CLASS_B
  owner: "COO"
  review_cycle: annually
  last_reviewed: "2026-06-21"
  approvers:
    - COO
fca_references:
  - "FCA SYSC 8.1 — operational alerting / escalation"

# ── Passport-bound skills (S-FAC-64; binding metadata only — does NOT activate, I-27) ──
allowed_skills:
  - context_memory_sync          # MANDATORY — IL/audit-trail continuity (I-28)
  - clean_architecture_enforcer  # MANDATORY — no cross-contour imports across ports (I-20)
  - error_handling_standardizer  # MANDATORY — typed exceptions on ports/adapters
  - api_contract_guardian        # MANDATORY — owns AlertRoutingPort/N8nTelegramAlertPort/AuditPort contract(s)
  - smart_test_generator         # CONTROLLED — port/scenario tests (no PII, no float I-05, no mocked audit I-24)
preferred_skill_sequences:
  scenario_service:
    - context_memory_sync
    - api_contract_guardian
    - error_handling_standardizer
    - smart_test_generator
    # quality-gate.sh MUST follow
mandatory_skill_triggers:
  context_memory_sync: ["any alerting_agent session start", "after any IL state change"]
  api_contract_guardian: ["AlertRoutingPort/N8nTelegramAlertPort/AuditPort change", "REST router / webhook schema change"]
  error_handling_standardizer: ["new adapter added", "AuditPort write-path change (I-24)"]
