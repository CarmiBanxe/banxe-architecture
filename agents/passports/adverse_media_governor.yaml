# Schema-conformance upgrade (2026-07-05, PR-fleetstubs): added the agent_passport.schema.json
# required fields (agent_id/name/version/level/trust_zone/capabilities/ports/bounded_context/
# invariants/governance) + department/human_double. STATUS STAYS PROPOSED — NOT activated (I-27);
# trust_zone/level are proposed values for operator ratification. Prior stub fields preserved below.
agent_id: adverse_media_governor
name: "AdverseMediaGovernor"
version: 0.1.0
status: PROPOSED
level: 2                          # governor sub-agent (proposed; operator to confirm)
trust_zone: AMBER                 # compliance/EDD governance contour (proposed; operator to confirm)
bounded_context: CTX-01          # AML / compliance (matches sanctions/tx_monitor context)
department: "Compliance / Adverse Media (EDD)"
human_double: "MLRO"             # per hitl.gate below (MLRO)
zone: compliance                  # (legacy field retained)
authority: T2                     # (legacy field retained)
ports:
  inbound:
    - port: AdverseMediaGovernorPort
      interface: "Receives EDD/adverse-media governance requests from aml_orchestrator"
  outbound:
    - port: MarbleCasePort
      interface: "Opens a Marble case on an adverse-media hit (marble_case_on_adverse_hit)"
    - port: ClickHouseAuditPort
      interface: "Append-only audit of governance events (I-24)"
invariants:
  - no_auto_clear_of_adverse_flag         # human (MLRO) must clear; agent never auto-clears
  - edd_enrichment_before_customer_accept # MLR 2017 Reg.28 EDD
governance:
  change_class: CLASS-B
  owner: "MLRO"
capabilities:
  - adverse_media_screening
  - negative_news_entity_match
  - edd_enrichment
consumes:
  - aml_orchestrator
  - ballerine_kyc_kyb_flow
produces:
  - marble_case_on_adverse_hit
  - clickhouse_audit_append_only
hitl:
  gate: MLRO
  trigger: adverse_media_hit
  rule: no_auto_clear_of_adverse_flag
compliance:
  - MLR_2017_Reg_28_EDD
  - FCA_high_risk_PEP_EDD
non_goals:
  - structured_sanctions_screening (covered by watchman/yente)
  - transaction_monitoring (covered by tx_monitor/jube)

# ── Passport-bound skills (S-FAC-64; binding metadata only — does NOT activate, I-27) ──
allowed_skills:
  - context_memory_sync          # MANDATORY — IL/audit-trail continuity (I-28)
  - rapid_spec_builder           # MANDATORY — compliance governor proposes IL/ADR for EDD findings (I-28)
prohibited_skills:
  - auto_refactor_pro            # PROHIBITED — compliance/EDD contour must not auto-refactor reviewed code (I-20)
preferred_skill_sequences:
  scenario_governance:
    - context_memory_sync
    - rapid_spec_builder
    # quality-gate.sh MUST follow
mandatory_skill_triggers:
  context_memory_sync: ["any adverse_media_governor session start", "after any IL state change"]
  rapid_spec_builder: ["new adverse-media finding", "new EDD recommendation", "ADR needed"]
