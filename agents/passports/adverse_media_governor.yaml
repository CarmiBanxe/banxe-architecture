id: adverse_media_governor
version: 0.1.0
status: PROPOSED
zone: compliance
authority: T2
change_class: CLASS-B
capabilities:
  - adverse_media_screening
  - negative_news_entity_match
  - edd_enrichment
consumes:
  - aml_orchestrator
  - ballerine_kyc_kyb_flow
produces:
  - marble_case_on_adverse_hit
  - clickhouse_audit_append_only
hitl:
  gate: MLRO
  trigger: adverse_media_hit
  rule: no_auto_clear_of_adverse_flag
compliance:
  - MLR_2017_Reg_28_EDD
  - FCA_high_risk_PEP_EDD
non_goals:
  - structured_sanctions_screening (covered by watchman/yente)
  - transaction_monitoring (covered by tx_monitor/jube)

# ── Passport-bound skills (S-FAC-64; binding metadata only — does NOT activate, I-27) ──
allowed_skills:
  - context_memory_sync          # MANDATORY — IL/audit-trail continuity (I-28)
  - rapid_spec_builder           # MANDATORY — compliance governor proposes IL/ADR for EDD findings (I-28)
prohibited_skills:
  - auto_refactor_pro            # PROHIBITED — compliance/EDD contour must not auto-refactor reviewed code (I-20)
preferred_skill_sequences:
  scenario_governance:
    - context_memory_sync
    - rapid_spec_builder
    # quality-gate.sh MUST follow
mandatory_skill_triggers:
  context_memory_sync: ["any adverse_media_governor session start", "after any IL state change"]
  rapid_spec_builder: ["new adverse-media finding", "new EDD recommendation", "ADR needed"]
