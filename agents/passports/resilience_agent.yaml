agent_id: resilience_agent
name: "ResilienceAgent"
version: "0.1.0"
status: PROPOSED
description: >
  Operational resilience support agent (DORA). Maintains DR/BCP scenarios,
  incident-response runbooks and ICT third-party risk tracking. PROPOSES only
  (I-27) — resilience decisions remain with CTIO + COO.
level: 2
trust_zone: AMBER
bounded_context: CTX-01
autonomy: L2_REVIEW
capabilities:
  - dr_bcp_scenario_modelling
  - incident_response_triage
  - ict_thirdparty_risk_tracking
  - resilience_gap_flagging
department: "Technology / Operational Resilience"
human_double: "CTIO"
ports:
  inbound:
    - port: ResilienceRequestPort
      description: Receives DR/BCP and incident-response requests
  outbound:
    - port: NotificationPort
      description: Escalates incidents to CTIO + COO (HITL)
    - port: AuditPort
      description: Immutable log of resilience assessments
allowed_callers:
  - admin_panel
allowed_callees:
  - notification_agent
invariants:
  - I-27  # agent PROPOSES only — CTIO + COO decide
governance:
  change_class: CLASS_B
  owner: "CTIO"
  review_cycle: annually
  last_reviewed: "2026-06-18"
  approvers:
    - CTIO
    - COO
fca_references:
  - "DORA (EU 2022/2554) — ICT operational resilience"
  - "FCA SYSC 15A — operational resilience (DR/BCP, incident response)"
# ── Passport-bound skills (S-FAC-64; binding metadata only — does NOT activate, I-27) ──
allowed_skills:
  - context_memory_sync          # MANDATORY — incident/IL continuity (DR/BCP state across sessions)
  - rapid_spec_builder           # MANDATORY — PROPOSES runbooks/IL/ADR for DR/BCP scenarios (I-27, I-28)
  - error_handling_standardizer  # MANDATORY — incident-response paths typed; AuditPort writes survive (I-08)
  - performance_scanner          # MANDATORY — DR RTO/RPO + incident-response SLA are time-critical
  - api_contract_guardian        # MANDATORY — owns ResilienceRequestPort / NotificationPort contracts
  - clean_architecture_enforcer  # MANDATORY advisory — no cross-contour imports (I-20)
  - smart_test_generator         # CONTROLLED — DR/BCP scenario tests (no real incident PII in fixtures)
  - traffic_light_audit          # S-FAC-65 CO-OWNER (RED escalation) — HITL on 🔴 verdict per §4.2; binding only, does NOT activate (I-27)
prohibited_skills:
  - auto_refactor_pro            # PROHIBITED — resilience runbooks are operationally critical (SYSC 15A)
preferred_skill_sequences:
  scenario_new_feature:
    - context_memory_sync
    - rapid_spec_builder         # IL/ADR before new DR/BCP scenario or runbook (I-28)
    - api_contract_guardian      # ResilienceRequestPort / NotificationPort contract
    - error_handling_standardizer
    - smart_test_generator
    # quality-gate.sh MUST follow
  scenario_incident_response:
    - context_memory_sync
    - performance_scanner        # SLA/RTO validation on incident hot path
    - error_handling_standardizer  # typed escalation; AuditPort durability (I-08)
    # quality-gate.sh MUST follow
mandatory_skill_triggers:
  context_memory_sync: ["any resilience_agent session start", "incident opened"]
  rapid_spec_builder: ["new DR/BCP scenario", "new incident-response runbook", "ICT third-party added"]
  api_contract_guardian: ["ResilienceRequestPort change", "NotificationPort change"]
  performance_scanner: ["RTO/RPO target change", "incident-response hot-path change"]
  error_handling_standardizer: ["escalation path change", "AuditPort write path change (I-08)"]
  traffic_light_audit: ["traffic-light verdict RED (HITL escalation to CTIO+COO)"]  # S-FAC-65 §4.2; PROPOSED (I-27), co-owner
