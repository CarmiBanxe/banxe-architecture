agent_id: safeguarding_audit_agent
name: "SafeguardingAuditAgent"
version: "0.1.0"
status: PROPOSED
description: >
  Annual safeguarding audit support agent. Prepares evidence and findings for
  the annual safeguarding audit (PS25/12; relevant funds > GBP 100k) against
  CASS 15. PROPOSES only (I-27) — sign-off remains with Head of Internal Audit.
level: 2
trust_zone: RED
bounded_context: CTX-01
autonomy: L2_REVIEW
capabilities:
  - safeguarding_audit_prep
  - reconciliation_evidence_collect
  - cass15_control_check
  - audit_finding_draft
department: "Internal Audit / Safeguarding"
human_double: "Head of Internal Audit"
ports:
  inbound:
    - port: AuditRequestPort
      description: Receives annual safeguarding audit scope
  outbound:
    - port: CompliancePort
      description: Submits findings to Head of Internal Audit (HITL)
    - port: AuditPort
      description: Append-only audit trail of findings (I-28)
allowed_callers:
  - admin_panel
allowed_callees:
  - compliance_officer_v1
invariants:
  - I-27  # agent PROPOSES only — Internal Audit signs off
  - I-28  # append-only audit evidence
governance:
  change_class: CLASS_B
  owner: "Head of Internal Audit"
  review_cycle: annually
  last_reviewed: "2026-06-18"
  approvers:
    - Head of Internal Audit
    - CRO
fca_references:
  - "PS25/12 — annual safeguarding audit (relevant funds > GBP 100k)"
  - "CASS 15 — safeguarding of relevant funds"
