agent_id: safeguarding_audit_agent
name: "SafeguardingAuditAgent"
version: "0.1.0"
status: PROPOSED
description: >
  Annual safeguarding audit support agent. Prepares evidence and findings for
  the annual safeguarding audit (PS25/12; relevant funds > GBP 100k) against
  CASS 15. PROPOSES only (I-27) — sign-off remains with Head of Internal Audit.
level: 2
trust_zone: RED
bounded_context: CTX-01
autonomy: L2_REVIEW
capabilities:
  - safeguarding_audit_prep
  - reconciliation_evidence_collect
  - cass15_control_check
  - audit_finding_draft
department: "Internal Audit / Safeguarding"
human_double: "Head of Internal Audit"
ports:
  inbound:
    - port: AuditRequestPort
      description: Receives annual safeguarding audit scope
  outbound:
    - port: CompliancePort
      description: Submits findings to Head of Internal Audit (HITL)
    - port: AuditPort
      description: Append-only audit trail of findings (I-28)
allowed_callers:
  - admin_panel
allowed_callees:
  - compliance_officer_v1
invariants:
  - I-27  # agent PROPOSES only — Internal Audit signs off
  - I-28  # append-only audit evidence
governance:
  change_class: CLASS_B
  owner: "Head of Internal Audit"
  review_cycle: annually
  last_reviewed: "2026-06-18"
  approvers:
    - Head of Internal Audit
    - CRO
fca_references:
  - "PS25/12 — annual safeguarding audit (relevant funds > GBP 100k)"
  - "CASS 15 — safeguarding of relevant funds"

# ── Passport-bound skills (S-FAC-64; binding metadata only — does NOT activate, I-27) ──
allowed_skills:
  - context_memory_sync          # MANDATORY — IL/audit-trail continuity (I-28)
  - rapid_spec_builder           # MANDATORY — proposes IL/ADR (I-27, I-28)
  - clean_architecture_enforcer  # MANDATORY — no cross-contour imports (I-20)
  - error_handling_standardizer  # MANDATORY — typed exceptions on ports/adapters
  - api_contract_guardian        # MANDATORY — owns port/API/webhook contract(s)
  - smart_test_generator         # CONTROLLED — port/scenario tests (no PII, no float I-05, no mocked audit I-24)
  - performance_scanner          # MANDATORY — time-critical AML/payment/recon path
prohibited_skills:
  - auto_refactor_pro            # PROHIBITED — internal-audit/safeguarding independence + CASS — ARP forbidden (I-20)
preferred_skill_sequences:
  scenario_compliance:
    - context_memory_sync
    - rapid_spec_builder
    - api_contract_guardian
    - error_handling_standardizer
    - performance_scanner
    - smart_test_generator
    # quality-gate.sh MUST follow
mandatory_skill_triggers:
  context_memory_sync: ["any safeguarding_audit_agent session start", "after any IL state change"]
  rapid_spec_builder: ["new IL proposal", "new ADR needed", "governance/spec recommendation"]
  api_contract_guardian: ["port / REST router / webhook schema change"]
  error_handling_standardizer: ["new adapter added", "AuditPort write-path change (I-24)"]
  performance_scanner: ["AML/payment/recon path change", "scoring latency regression"]
