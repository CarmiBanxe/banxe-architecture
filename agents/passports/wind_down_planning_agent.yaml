agent_id: wind_down_planning_agent
name: "WindDownPlanningAgent"
version: "0.1.0"
status: PROPOSED
description: >
  Wind-down planning support agent. Models run-off scenarios and maintains the
  wind-down trigger framework per the FCA Approach Document (2026). PROPOSES
  only (I-27) — adoption requires CFO + Board.
level: 2
trust_zone: AMBER
bounded_context: CTX-10-REPORTING
autonomy: L2_REVIEW
capabilities:
  - run_off_scenario_modelling
  - wind_down_trigger_tracking
  - resource_estimate_build
  - solvency_wind_down_flagging
department: "Finance / Recovery & Resolution"
human_double: "CFO"
ports:
  inbound:
    - port: WindDownRequestPort
      description: Receives scenario / trigger evaluation requests
  outbound:
    - port: ReportingPort
      description: Produces wind-down pack drafts for CFO + Board (HITL)
    - port: AuditPort
      description: Immutable log of wind-down assessments
allowed_callers:
  - admin_panel
allowed_callees:
  - reporting_agent
  - notification_agent
invariants:
  - I-27  # agent PROPOSES only — CFO + Board decide
governance:
  change_class: CLASS_B
  owner: "CFO"
  review_cycle: annually
  last_reviewed: "2026-06-18"
  approvers:
    - CFO
    - Board
fca_references:
  - "FCA Approach Document (2026) — wind-down planning"
  - "FCA WDPG — Wind-Down Planning Guide (run-off scenarios)"

# ── Passport-bound skills (S-FAC-64; binding metadata only — does NOT activate, I-27) ──
allowed_skills:
  - context_memory_sync          # MANDATORY — IL/audit-trail continuity (I-28)
  - rapid_spec_builder           # MANDATORY — proposes IL/ADR (I-27, I-28)
  - clean_architecture_enforcer  # MANDATORY — no cross-contour imports (I-20)
  - error_handling_standardizer  # MANDATORY — typed exceptions on ports/adapters
  - api_contract_guardian        # MANDATORY — owns port/API/webhook contract(s)
  - smart_test_generator         # CONTROLLED — port/scenario tests (no PII, no float I-05, no mocked audit I-24)
  - dependency_optimizer         # CONTROLLED — deps + licence audit (IL required)
preferred_skill_sequences:
  scenario_service:
    - context_memory_sync
    - rapid_spec_builder
    - api_contract_guardian
    - error_handling_standardizer
    - smart_test_generator
    # quality-gate.sh MUST follow
mandatory_skill_triggers:
  context_memory_sync: ["any wind_down_planning_agent session start", "after any IL state change"]
  rapid_spec_builder: ["new IL proposal", "new ADR needed", "governance/spec recommendation"]
  api_contract_guardian: ["port / REST router / webhook schema change"]
  error_handling_standardizer: ["new adapter added", "AuditPort write-path change (I-24)"]
  dependency_optimizer: ["new dependency added", "Docker base image update", "licence audit request"]
