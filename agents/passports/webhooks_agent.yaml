agent_id: webhooks_agent
name: "WebhooksAgent"
version: "0.1.0"
status: PROPOSED
description: >
  Owner agent for the EXISTING banxe-emi-stack runtime service `services/webhooks/`
  (code-derived from its handlers, e.g. HttpWebhookDeliveryClient). PROPOSES only (I-27); created by
  SP-PASSPORT-COV to close the orphan-service governance gap. NOT activated — PROPOSED
  until a separate operator gate.
level: 2
trust_zone: AMBER
bounded_context: CTX-03
autonomy: L2_REVIEW
capabilities:
  - webhook_http_delivery
  - delivery_reliability
  - webhook_audit
  - dlq_alert
department: "Technology / Integrations"
human_double: "CTO"
non_goals:
  - "Do NOT reimplement services/webhooks/ — existing code in banxe-emi-stack"
  - "Do NOT auto-activate — PROPOSED only (I-27), gated on operator approval"
ports:
  inbound:
    - port: WebhookDeliveryPort
      description: Primary inbound port (code-derived from services/webhooks)
  outbound:
    - port: WebhookAuditStorePort
      description: derived from services/webhooks code
    - port: ReliabilityPort
      description: derived from services/webhooks code
    - port: AuditPort
      description: Immutable audit log (I-08)
allowed_callers:
  - webhook_orchestrator
allowed_callees:
  - clickhouse_writer
  - notification_agent
invariants:
  - I-27
  - I-08
governance:
  change_class: CLASS_B
  owner: "CTO"
  review_cycle: annually
  last_reviewed: "2026-06-21"
  approvers:
    - CTO
fca_references:
  - "FCA SYSC 8.1 — operational resilience (delivery)"
