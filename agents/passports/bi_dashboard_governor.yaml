agent_id: bi_dashboard_governor
name: "BiDashboardGovernor"
version: "0.1.0"
status: PROPOSED
description: >
  BI / Dashboards governance agent. Governs dashboard access control,
  certified-dataset + semantic-layer governance, row-level security policy,
  no-PII-in-dashboards enforcement, and BI audit trail — routing to the
  EXISTING Superset/Metabase tooling in banxe-emi-stack. PROPOSES only
  (I-27); NOT activated until a separate operator gate.
level: 2
trust_zone: AMBER
bounded_context: CTX-08-DATA
autonomy: L2_REVIEW
capabilities:
  - dashboard_access_governance
  - certified_dataset_governance
  - row_level_security_policy
  - no_pii_in_dashboards_enforcement
  - bi_audit_trail_review
department: "Data / Analytics"
human_double: "Head of Data"
non_goals:
  - "Do NOT reimplement Superset/Metabase — BI tooling already exists in banxe-emi-stack"
  - "Do NOT duplicate L-lake ELT/streaming/lineage pipeline (GAP-040) — this agent governs BI dashboards/access, not the data pipeline"
  - "Do NOT govern source-system data quality — dashboard/semantic layer scope only"
  - "Do NOT activate the BI channel — PROPOSED only, gated"
ports:
  inbound:
    - port: BiGovernancePort
      description: Receives dashboard-access / dataset / RLS / no-PII / BI-audit review requests

# ── Passport-bound skills (S-FAC-64; binding metadata only — does NOT activate, I-27) ──
allowed_skills:
  - context_memory_sync          # MANDATORY — IL/audit-trail continuity (I-28)
  - rapid_spec_builder           # MANDATORY — proposes IL/ADR for new port/service (I-28)
  - clean_architecture_enforcer  # MANDATORY — no cross-contour imports across ports (I-20)
  - error_handling_standardizer  # MANDATORY — typed exceptions on ports/adapters
  - api_contract_guardian        # MANDATORY — owns BiGovernancePort contract(s)
  - smart_test_generator         # CONTROLLED — port/scenario tests (no PII, no float I-05, no mocked audit I-24)
preferred_skill_sequences:
  scenario_governance:
    - context_memory_sync
    - api_contract_guardian
    - error_handling_standardizer
    - smart_test_generator
    # quality-gate.sh MUST follow
mandatory_skill_triggers:
  context_memory_sync: ["any bi_dashboard_governor session start", "after any IL state change"]
  api_contract_guardian: ["BiGovernancePort change", "REST router / webhook schema change"]
  error_handling_standardizer: ["new adapter added", "AuditPort write-path change (I-24)"]
