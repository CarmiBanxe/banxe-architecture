agent_id: support_sla_governor
name: "SupportSlaGovernor"
version: "0.1.0"
status: PROPOSED
description: >
  Support ticketing + SLA governance agent. Governs ticket prioritisation,
  SLA timers and escalation, breach metrics, support retention and audit
  trail — routing to the EXISTING services/support implementation in
  banxe-emi-stack. PROPOSES only (I-27); NOT activated until a separate
  operator gate.
level: 2
trust_zone: AMBER
bounded_context: CTX-06-CUSTOMER
autonomy: L2_REVIEW
capabilities:
  - ticket_prioritisation_governance
  - sla_timer_escalation_governance
  - sla_breach_metrics_review
  - support_retention_governance
  - support_audit_trail_review
department: "Customer Operations / Support"
human_double: "Head of Customer Operations"
non_goals:
  - "Do NOT reimplement services/support/* — support tooling already exists in banxe-emi-stack"
  - "Do NOT duplicate crm_dsar_governor DSAR SLA/registry/retention (SP-18) — this agent governs support-ticket SLA, not DSAR"
  - "Do NOT duplicate privacy_compliance_agent DSAR legal triage (SP-10)"
  - "Do NOT activate the support channel — PROPOSED only, gated"
ports:
  inbound:
    - port: SupportGovernancePort
      description: Receives ticket-SLA / escalation / breach-metric / support-audit review requests

# ── Passport-bound skills (S-FAC-64; binding metadata only — does NOT activate, I-27) ──
allowed_skills:
  - context_memory_sync          # MANDATORY — IL/audit-trail continuity (I-28)
  - rapid_spec_builder           # MANDATORY — proposes IL/ADR (I-27, I-28)
  - clean_architecture_enforcer  # MANDATORY — no cross-contour imports (I-20)
  - error_handling_standardizer  # MANDATORY — typed exceptions on ports/adapters
  - api_contract_guardian        # MANDATORY — owns port/API/webhook contract(s)
  - smart_test_generator         # CONTROLLED — port/scenario tests (no PII, no float I-05, no mocked audit I-24)
preferred_skill_sequences:
  scenario_service:
    - context_memory_sync
    - rapid_spec_builder
    - api_contract_guardian
    - error_handling_standardizer
    - smart_test_generator
    # quality-gate.sh MUST follow
mandatory_skill_triggers:
  context_memory_sync: ["any support_sla_governor session start", "after any IL state change"]
  rapid_spec_builder: ["new IL proposal", "new ADR needed", "governance/spec recommendation"]
  api_contract_guardian: ["port / REST router / webhook schema change"]
  error_handling_standardizer: ["new adapter added", "AuditPort write-path change (I-24)"]
