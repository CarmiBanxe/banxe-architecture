agent_id: banxe_aml_orchestrator
name: "Banxe AML Orchestrator"
version: "3.0.0"
description: >
  Top-level Level-1 orchestrator. Receives CustomerProfile and coordinates all
  Level-2 sub-agents (aml_orchestrator, sanctions_check, tx_monitor, crypto_aml).
  Aggregates scores, builds ExplanationBundle, and emits the final BanxeAMLResult.
level: 1
trust_zone: AMBER
bounded_context: CTX-01
capabilities:
  - orchestrate
  - risk_assessment
  - score_aggregate
  - explanation_build
  - emergency_check
ports:
  inbound:
    - port: PolicyPort
      interface: src/compliance/ports/policy_port.py
      adapter: src/compliance/adapters/compliance_config_adapter.py
    - port: EmergencyPort
      interface: src/compliance/ports/emergency_port.py
      adapter: src/compliance/emergency_stop.py
  outbound:
    - port: AuditPort
      interface: src/compliance/ports/audit_port.py
      adapter: src/compliance/adapters/banxe_aml_decision_adapter.py
    - port: DecisionPort
      interface: src/compliance/ports/decision_port.py
      adapter: src/compliance/adapters/banxe_aml_decision_adapter.py
allowed_callers: []
allowed_callees:
  - aml_orchestrator
  - sanctions_check
  - tx_monitor
  - crypto_aml
invariants:
  - I-21
  - I-22
  - I-23
  - I-24
  - I-25
governance:
  change_class: CLASS_B
  owner: "Compliance Engineering"
  review_cycle: quarterly
  last_reviewed: "2026-04-05"
  approvers:
    - DEVELOPER
    - CTIO
    - CEO
fca_references:
  - "MLR 2017 Reg.28 — ongoing monitoring"
  - "FCA SS1/23 — model risk management"
  - "EU AI Act Art.14 — human oversight"
aigf_risks:
  - AIGF-A-01
  - AIGF-B-01
  - AIGF-C-01

# ── Passport-bound skills (S-FAC-64; binding metadata only — does NOT activate) ──
# Real Level-1 orchestrator WITH ports (PolicyPort/EmergencyPort/AuditPort/DecisionPort) +
# AML scoring → code + performance skills genuinely apply (unlike the stub dept-heads).
allowed_skills:
  - context_memory_sync          # MANDATORY — IL/audit-trail continuity (I-28)
  - rapid_spec_builder           # MANDATORY — Level-1 orchestrator proposes IL/ADR for new sub-agent/port (I-28)
  - clean_architecture_enforcer  # MANDATORY — no cross-contour imports across the 4 ports/adapters (I-20)
  - error_handling_standardizer  # MANDATORY — typed exceptions on PolicyPort/AuditPort; AuditPort writes survive (I-24)
  - api_contract_guardian        # MANDATORY — owns PolicyPort/EmergencyPort/AuditPort/DecisionPort contracts
  - performance_scanner          # MANDATORY — AML score-aggregate / risk-assessment is a time-critical path
  - smart_test_generator         # CONTROLLED — scenario/port tests; no real PII in fixtures, no float in amounts (I-05), no mocked audit writes (I-24)
  - dependency_optimizer         # CONTROLLED — adapter Python deps + licence audit (IL required)
prohibited_skills:
  - auto_refactor_pro            # PROHIBITED — AML compliance contour; ARP forbidden on services/aml/ (I-20, SKILLS-MATRIX §9)
preferred_skill_sequences:
  scenario_compliance:           # any change touching the AML orchestration / ports
    - context_memory_sync
    - rapid_spec_builder
    - api_contract_guardian      # PolicyPort/EmergencyPort/AuditPort/DecisionPort contract
    - error_handling_standardizer
    - performance_scanner        # AML scoring latency
    - smart_test_generator
    # quality-gate.sh MUST follow
mandatory_skill_triggers:
  context_memory_sync: ["any banxe_aml_orchestrator session start", "after any IL state change"]
  api_contract_guardian: ["PolicyPort change", "EmergencyPort change", "AuditPort change", "DecisionPort change"]
  error_handling_standardizer: ["new adapter added", "AuditPort write-path change (I-24)"]
  performance_scanner: ["AML scoring path change", "score-aggregate latency regression"]
