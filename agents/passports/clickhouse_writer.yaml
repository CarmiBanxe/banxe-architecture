agent_id: clickhouse_writer
name: "ClickHouse Audit Writer"
version: "1.0.0"
description: >
  Level-3 GREEN adapter. Persists DecisionEvents to ClickHouse (banxe DB,
  decision_events table) with TTL = 5 years (I-17: DORA data retention).
  Append-only — no UPDATE or DELETE queries permitted (I-24).
level: 3
trust_zone: GREEN
bounded_context: CTX-03
capabilities:
  - event_write
  - audit_read
ports:
  inbound:
    - port: AuditPort
      interface: src/compliance/ports/audit_port.py
      adapter: src/compliance/utils/decision_event_log.py
allowed_callers:
  - banxe_aml_orchestrator
  - aml_orchestrator
allowed_callees: []
invariants:
  - I-17
  - I-24
governance:
  change_class: CLASS_A
  owner: "Platform Engineering"
  review_cycle: annually
  last_reviewed: "2026-04-05"
  approvers:
    - DEVELOPER
fca_references:
  - "DORA Art.14(2) — immutable audit logs"
  - "MLR 2017 Reg.40 — record keeping 5 years"
aigf_risks:
  - AIGF-B-02

# ── Passport-bound skills (S-FAC-64; binding metadata only — does NOT activate, I-27) ──
allowed_skills:
  - context_memory_sync          # MANDATORY — IL/audit-trail continuity (I-28)
  - rapid_spec_builder           # MANDATORY — proposes IL/ADR for new port/service (I-28)
  - clean_architecture_enforcer  # MANDATORY — no cross-contour imports across ports (I-20)
  - error_handling_standardizer  # MANDATORY — typed exceptions on ports/adapters
  - api_contract_guardian        # MANDATORY — owns AuditPort contract(s)
  - smart_test_generator         # CONTROLLED — port/scenario tests (no PII, no float I-05, no mocked audit I-24)
prohibited_skills:
  - auto_refactor_pro            # PROHIBITED — append-only audit-trail writer — ARP must not touch audit write path (I-24)
preferred_skill_sequences:
  scenario_service:
    - context_memory_sync
    - api_contract_guardian
    - error_handling_standardizer
    - smart_test_generator
    # quality-gate.sh MUST follow
mandatory_skill_triggers:
  context_memory_sync: ["any clickhouse_writer session start", "after any IL state change"]
  api_contract_guardian: ["AuditPort change", "REST router / webhook schema change"]
  error_handling_standardizer: ["new adapter added", "AuditPort write-path change (I-24)"]
