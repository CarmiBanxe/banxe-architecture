agent_id: case_management_agent
name: "CaseManagementAgent"
version: "0.1.0"
status: PROPOSED
description: >
  Owner agent for the EXISTING banxe-emi-stack runtime service `services/case_management/`
  (code-derived from its handlers, e.g. CaseManagementService). PROPOSES only (I-27); created by
  SP-PASSPORT-COV to close the orphan-service governance gap. NOT activated — PROPOSED
  until a separate operator gate.
level: 2
trust_zone: RED
bounded_context: CTX-01
autonomy: L2_REVIEW
capabilities:
  - case_create
  - case_lifecycle_track
  - marble_case_routing
  - mlro_case_queue
department: "Compliance / Case Management"
human_double: "MLRO"
non_goals:
  - "Do NOT reimplement services/case_management/ — existing code in banxe-emi-stack"
  - "Do NOT auto-activate — PROPOSED only (I-27), gated on operator approval"
ports:
  inbound:
    - port: CaseManagementPort
      description: Primary inbound port (code-derived from services/case_management)
  outbound:
    - port: MarbleCasePort
      description: derived from services/case_management code
    - port: AuditPort
      description: Immutable audit log (I-08)
allowed_callers:
  - aml_orchestrator
  - banxe_aml_orchestrator
allowed_callees:
  - clickhouse_writer
invariants:
  - I-27
  - I-08
  - I-12
governance:
  change_class: CLASS_B
  owner: "MLRO"
  review_cycle: annually
  last_reviewed: "2026-06-21"
  approvers:
    - MLRO
fca_references:
  - "FCA SYSC 6 — compliance case handling"
  - "POCA 2002 — SAR case workflow"

# ── Passport-bound skills (S-FAC-64; binding metadata only — does NOT activate, I-27) ──
allowed_skills:
  - context_memory_sync          # MANDATORY — IL/audit-trail continuity (I-28)
  - rapid_spec_builder           # MANDATORY — proposes IL/ADR for new port/service (I-28)
  - clean_architecture_enforcer  # MANDATORY — no cross-contour imports across ports (I-20)
  - error_handling_standardizer  # MANDATORY — typed exceptions on ports/adapters
  - api_contract_guardian        # MANDATORY — owns CaseManagementPort/MarbleCasePort/AuditPort contract(s)
  - smart_test_generator         # CONTROLLED — port/scenario tests (no PII, no float I-05, no mocked audit I-24)
prohibited_skills:
  - auto_refactor_pro            # PROHIBITED — compliance/MLRO case contour must not auto-refactor reviewed code (I-20)
preferred_skill_sequences:
  scenario_compliance:
    - context_memory_sync
    - api_contract_guardian
    - error_handling_standardizer
    - smart_test_generator
    # quality-gate.sh MUST follow
mandatory_skill_triggers:
  context_memory_sync: ["any case_management_agent session start", "after any IL state change"]
  api_contract_guardian: ["CaseManagementPort/MarbleCasePort/AuditPort change", "REST router / webhook schema change"]
  error_handling_standardizer: ["new adapter added", "AuditPort write-path change (I-24)"]
