agent_id: channel_c_sepa_orchestrator
name: "ChannelCSepaOrchestrator"
version: "0.1.0"
status: PROPOSED
description: >
  Channel C SEPA orchestration agent. Routes SEPA Credit Transfer (SCT) and
  SEPA Instant (SCT Inst) payment intents to the EXISTING production adapter in
  banxe-emi-stack (services/payment/production/modulr_sepa_adapter.py) and tracks
  settlement status. PROPOSES only (I-27); Channel C is NOT activated until a
  separate operator gate.
level: 2
trust_zone: AMBER
bounded_context: CTX-04-PAYMENT
autonomy: L2_REVIEW
capabilities:
  - sepa_ct_orchestration
  - sepa_instant_orchestration
  - payment_rail_routing
  - settlement_status_track
department: "Payments / Channel C"
human_double: "CTIO"
non_goals:
  - "Do NOT reimplement services/payment/production/modulr_sepa_adapter.py — SEPA CT + SEPA Instant already DONE in banxe-emi-stack"
  - "Do NOT reimplement services/payment/legacy/legacy_sepa_adapter.py"
  - "Do NOT reimplement payment_service / payment_port / modulr_client (existing code repo)"
  - "Do NOT activate Channel C execution — PROPOSED only, gated"
ports:
  inbound:
    - port: PaymentIntentPort
      description: Receives SEPA CT / Instant payment intents
  outbound:
    - port: PaymentRailPort
      description: Routes to existing modulr_sepa_adapter (banxe-emi-stack) — orchestration only
    - port: AuditPort
      description: Immutable log of orchestration decisions (I-08)
allowed_callers:
  - admin_panel
allowed_callees:
  - notification_agent
invariants:
  - I-27  # agent PROPOSES only — execution gated, Channel C not activated
  - I-08  # log all payment-orchestration decisions
governance:
  change_class: CLASS_B
  owner: "CTIO"
  review_cycle: annually
  last_reviewed: "2026-06-19"
  approvers:
    - CTIO
    - COO
fca_references:
  - "EPC SCT Rulebook — SEPA Credit Transfer scheme"
  - "EPC SCT Inst Rulebook — SEPA Instant Credit Transfer scheme"
  - "FCA / PSRs 2017 — payment services"

# ── Passport-bound skills (S-FAC-64; binding metadata only — does NOT activate, I-27) ──
allowed_skills:
  - context_memory_sync          # MANDATORY — IL/audit-trail continuity (I-28)
  - rapid_spec_builder           # MANDATORY — proposes IL/ADR for new port/service (I-28)
  - clean_architecture_enforcer  # MANDATORY — no cross-contour imports across ports (I-20)
  - error_handling_standardizer  # MANDATORY — typed exceptions on ports/adapters
  - api_contract_guardian        # MANDATORY — owns PaymentIntentPort/PaymentRailPort/AuditPort contract(s)
  - smart_test_generator         # CONTROLLED — port/scenario tests (no PII, no float I-05, no mocked audit I-24)
  - performance_scanner          # MANDATORY — payment/scoring path is time-critical
prohibited_skills:
  - auto_refactor_pro            # PROHIBITED — payment contour — ARP forbidden on services/payment (I-20)
preferred_skill_sequences:
  scenario_payment:
    - context_memory_sync
    - api_contract_guardian
    - error_handling_standardizer
    - performance_scanner
    - smart_test_generator
    # quality-gate.sh MUST follow
mandatory_skill_triggers:
  context_memory_sync: ["any channel_c_sepa_orchestrator session start", "after any IL state change"]
  api_contract_guardian: ["PaymentIntentPort/PaymentRailPort/AuditPort change", "REST router / webhook schema change"]
  error_handling_standardizer: ["new adapter added", "AuditPort write-path change (I-24)"]
  performance_scanner: ["payment/scoring path change", "settlement latency regression"]
