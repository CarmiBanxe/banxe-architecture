non_goals:
  - "Do NOT reimplement services/user_preferences/ — existing code in banxe-emi-stack"
  - "Do NOT auto-activate — PROPOSED only (I-27), gated on operator approval"
ports:
  inbound:
    - port: ConsentPort
      description: Primary inbound port (code-derived from services/user_preferences)
  outbound:
    - port: AuditPort
      description: Immutable audit log (I-08)
allowed_callers:
  - customer_lifecycle_agent
  - crm_dsar_governor
allowed_callees:
  - clickhouse_writer
invariants:
  - I-27
  - I-08
governance:
  change_class: CLASS_B
  owner: "COO"
  review_cycle: annually
  last_reviewed: "2026-06-21"
  approvers:
    - COO
fca_references:
  - "UK GDPR Art.7 — consent"
  - "UK GDPR Art.20 — data portability (DSAR)"
