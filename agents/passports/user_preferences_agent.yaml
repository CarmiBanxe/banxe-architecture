level: 2
trust_zone: GREEN
bounded_context: CTX-06-CUSTOMER
autonomy: L2_REVIEW
capabilities:
  - preference_store
  - consent_management
  - data_export_dsar
  - consent_audit
department: "Customer Operations / Preferences & Consent"
