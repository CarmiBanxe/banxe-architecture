agent_id: user_preferences_agent
name: "UserPreferencesAgent"
version: "0.1.0"
status: PROPOSED
description: >
  Owner agent for the EXISTING banxe-emi-stack runtime service `services/user_preferences/`
  (code-derived from its handlers, e.g. ConsentManager). PROPOSES only (I-27); created by
  SP-PASSPORT-COV to close the orphan-service governance gap. NOT activated — PROPOSED
