# governance/novelty-pipeline-config.yaml
# B->A novelty auto-handoff pipeline — Central-owned configuration.
#
# STATUS: PROPOSED (template only). Values below are DEFAULTS FOR REVIEW; the
# file is not authoritative until Central accepts it in a follow-up PR. See
# ADR-159 (B->A novelty auto-handoff pipeline) for the rationale, and the
# ADR's "Open items" section for the values that require Central sign-off.
#
# Config-over-Hardcoding (CLAUDE.md §10): thresholds, corpus scope, retention,
# and escalation live HERE, not in the ADR prose and not in code.
#
# Ownership: Central (per ADR-159 D-4 Ownership table). Factory / Terminal-B
# do not edit this file unilaterally.
---
status: PROPOSED

novelty_check:
  # Metric used to score a candidate finding against the knowledge corpus.
  # cosine similarity over sentence-transformer embeddings — see ADR-159 §D-4.
  metric: cosine_similarity

  # Novelty threshold: a candidate is NOVEL when the cosine similarity to the
  # nearest corpus item is STRICTLY LESS than this value; otherwise it is
  # classified as a duplicate and the factory appends verdict=duplicate to the
  # HANDOFF-QUEUE without opening a draft PR.
  #
  # 0.85 is a starting-point default pending calibration on the current corpus
  # (ADR-159 OI-1). Central must ratify or replace this value before the
  # workflow is activated.
  threshold: 0.85

  # Corpus scope for the semantic novelty check. Knowledge artefacts only —
  # NOT the whole main (implementation code would flood the score with noise).
  # ADR-159 OI-2 open until Central confirms this list.
  corpus_paths:
    - governance/
    - docs/adr/
    - docs/agent-engine-dossier/

  # Files under the corpus paths above that must be EXCLUDED from embedding
  # (generated artefacts, snapshots, machine-produced reports).
  corpus_excludes:
    - "**/FROZEN-ARCHIVE.md"
    - "**/*.snapshot.md"

model_routing:
  # Compute layout for the pipeline. Each stage runs where its cost / latency
  # profile fits best. Aliases are the LiteLLM :4000 canonical names anchored
  # in governance/COMPUTE-ROUTING-TAXONOMY.md §5.
  #
  # NOTE: aliases are subject to the taxonomy; keep this section in sync with
  # the taxonomy, do not fork new alias names here.
  candidate_extraction:
    host: evo1
    alias: glm-air        # fast lane, short context
    fallback: qwen3-coder
  semantic_verification:
    host: evo2
    alias: reasoning-235b # async lane; QUEUE decouples turnaround
  pr_assembly:
    host: evo1
    driver: claude-code   # ADR-103 build venue
    env:
      REDIS_HOST: 127.0.0.1   # shared IL allocator, fail-closed (ADR-143)

trigger:
  # GitHub Actions workflow that detects new NEW-status rows appended to
  # governance/NOVELTY-COLLECTION-REGISTER.md on push-to-main and appends
  # picked-up events to governance/NOVELTY-HANDOFF-QUEUE.md.
  # This section describes intent only; the workflow YAML is NOT shipped by
  # ADR-159 and is a follow-up implementation task.
  detection_workflow: .github/workflows/novelty-handoff.yml
  watch_files:
    - governance/NOVELTY-COLLECTION-REGISTER.md
  emit_events_to: governance/NOVELTY-HANDOFF-QUEUE.md

watcher:
  # evo1-side systemd timer that polls the HANDOFF-QUEUE for picked-up-without-
  # processed entries and dispatches claude -p runs against the factory.
  # Values below are placeholders pending the implementation task.
  host: evo1
  systemd_unit: factory-watcher.service
  systemd_timer: factory-watcher.timer
  poll_interval_seconds: 60

boundaries:
  # ADR-159 D-5: automation stops at draft-PR; merge is HITL.
  auto_open_draft_pr: true
  auto_merge: false                        # NEVER — HITL per CLAUDE.md §71
  live_keys_or_mainnet_allowed: false      # ADR-156 sandbox posture
  fail_stop_stage_on_error: true           # no silent retries past a stop-barrier

open_items:
  # Mirrors ADR-159 "Open items" — kept here so a config reviewer sees the
  # unresolved decisions without cross-referencing the ADR.
  - id: OI-1
    description: "Ratify or replace novelty_check.threshold after calibration."
  - id: OI-2
    description: "Confirm final novelty_check.corpus_paths list."
  - id: OI-3
    description: "Assign @<factory-owner> for CODEOWNERS on novelty-*.yml + HANDOFF-QUEUE.md."
