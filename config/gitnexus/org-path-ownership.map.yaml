    owns:
      - "bank-rooms/F2-payments-room/**"
  "Safeguarding (FCA CASS 7)":        # §1.5
    owns:
      - "bank-rooms/F2-safeguarding-room/**"
  "Core Banking / Ledger":            # §1.4
    owns:
      - "bank-rooms/F2-ledger-room/**"
  "AML/Compliance":                   # §1.2
    owns:
      - "bank-rooms/F3-aml-room/**"
  "Reporting / FCA Regulatory":       # §1.10
    owns:
      - "bank-rooms/F3-regrep-room/**"
  "Security / Authentication":        # §1.9
    owns:
      - "bank-rooms/F4-security-room/**"
  "Customer Onboarding":              # §1.1 (KYC/IDV function ~ identity room)
    owns:
      - "bank-rooms/F2-identity-room/**"

# ── TODO-operator: неоднозначные сопоставления — НЕ угадано (NO-MOCK) ────────
