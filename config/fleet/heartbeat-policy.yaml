# ─────────────────────────────────────────────────────────────────────────────
# Heartbeat / health thresholds — CONFIG-AS-DATA (Config-over-Hardcoding, CLAUDE.md §10)
#
# Policy prose: docs/governance/SERVER-CONTROL-ORCHESTRATION.md. Inventory: config/fleet/server-inventory.yaml.
# Thresholds are READ as data by the infra-side monitor; the monitor MUST NOT hardcode them
# (a threshold change is a config edit + re-ratification, never a code change).
#
# RATIFIED 2026-07-02 by operator (audit-resolved placement). No monitor/daemon/enforcer configured here.
# ─────────────────────────────────────────────────────────────────────────────
schema_version: "1.0.0"
status: ratified            # operator ratified 2026-07-02 (audit-resolved placement); thresholds accepted as-is

ratification:
  ratified: true
  ratified_by: "operator"
  ratified_at: "2026-07-02"
  basis: "audit-resolved placement (banxe-monitoring locus, Legion/tailscale watcher, Prometheus+Telegram alerts); thresholds accepted as-is"

# ── Placement (audit-resolved 2026-07-02; see policy Appendix). Runtime is infra-side, NOT configured here. ──
placement:
  enforcement_locus: banxe-monitoring        # operator-owned monitoring repo, beyond ADR-117 perimeter (code built infra-side, not factory)
  watcher_node: Legion                       # external watcher; reaches both nodes over tailscale (survives a monitored node's death, policy §4)
  watcher_transport: tailscale               # evo1 100.68.102.48 reachable even when USB4 is down
  alert_primary: prometheus-alertmanager     # existing (evo2 127.0.0.1:9090/9093)
  alert_secondary: telegram-adr002           # ADR-002 Telegram bot

heartbeat:
  heartbeat_interval_s: 30      # ratified — each on/always-on host answers a liveness probe this often
  freshness_window_s: 90        # ratified — heartbeat older than this = stale (= 3× interval)
  missed_beats: 3               # ratified — consecutive missed beats OR stale ⇒ host = SUSPECT
  retry_grace_s: 10             # ratified — one-retry wait after a failed health-check

# States a host moves through (policy §heartbeat): HEALTHY → SUSPECT → UNHEALTHY (+ RECOVERED)
health_states: [HEALTHY, SUSPECT, UNHEALTHY, RECOVERED]

# Retry discipline: on health-check fail, retry ONCE after retry_grace_s; second fail ⇒ UNHEALTHY.
retry_rule:
  attempts: 1                   # one retry (total 2 checks) before UNHEALTHY

# Planned vs unexpected (policy §critical-distinction) — drives alert severity:
#   operator-shutdown-window + SUSPECT      ⇒ planned  ⇒ INFO
#   on/always-on + SUSPECT + NO window      ⇒ UNEXPECTED_OUTAGE ⇒ CRITICAL   (the evo1 case)
outage_classification:
  planned_when: "host.expected_state == operator-shutdown-window (declared in inventory/journal)"
  unexpected_when: "host.expected_state in {always-on, on-when-scheduled} AND no open shutdown-window"

# Alert severity map (policy §alerting):
severity_map:
  UNEXPECTED_OUTAGE: CRITICAL
  HEALTH_FAIL: WARN
  planned_shutdown: INFO
  RECOVERED: INFO

ratify:
  - key: "heartbeat.*"
    status: ratified
    note: "RATIFIED 2026-07-02 (operator): heartbeat_interval_s=30, freshness_window_s=90, missed_beats=3, retry_grace_s=10 — accepted as-is"
  - key: "placement.*"
    status: ratified
    note: "RATIFIED 2026-07-02 (operator, audit-resolved): banxe-monitoring locus, Legion/tailscale watcher, prometheus-alertmanager primary + telegram-adr002 secondary"
open_questions:
  - key: "prometheus_enable_wiring"
    note: "[BLOCKING: operator/infra wiring] Prometheus on evo2 = systemd inactive but port listening → operator choice (systemctl enable --now prometheus, CTIO-carry-forward) OR keep docker/manual. Open wiring item — NOT decided/executed here."
